<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>打盗全家捅</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ 卡A：顶栏 + 搜索来源 + 书签区 ============ -->
<section class="card">
  <div class="row">
    <input id="bookInput" class="input input-book" type="text" placeholder="输入书名">
    <button id="btnSearch" class="btn btn-primary">搜索</button>
    <div class="row" style="gap:2px">
      <span class="label">页数</span>
      <input id="pagesInput" class="input input-pages" type="text" placeholder="自动">
    </div>
    <button id="btnBookmark" class="btn btn-soft">保存为书签</button>
    <button id="btnStop" class="btn btn-disabled" disabled>停止</button>
    <button id="btnCaptchaContinue" class="btn btn-disabled">我已过验证，继续</button>
    <span class="spacer"></span>
    <button id="btnClearCookies" class="btn btn-soft-green">清 cookies</button>
  </div>

  <div class="hdiv"></div>

  <!-- 【2】搜索来源：第 1 行（PC 版 + 前台开关） -->
  <div class="row tight">
    <button id="btnToggleSources" class="btn-text">全选 / 取消</button>
    <label class="check"><input type="checkbox" name="source" value="quark_cn">夸克</label>
    <label class="check"><input type="checkbox" name="source" value="baidu">百度</label>
    <label class="check"><input type="checkbox" name="source" value="zhidao">知道</label>
    <label class="check"><input type="checkbox" name="source" value="tieba">贴吧</label>
    <label class="check"><input type="checkbox" name="source" value="bing">必应</label>
    <label class="check"><input type="checkbox" name="source" value="toutiao_pc">头条</label>
    <label class="check"><input type="checkbox" name="source" value="sogou_pc">搜狗</label>
    <label class="check"><input type="checkbox" name="source" value="so360_pc">360</label>
    <label class="check"><input type="checkbox" name="source" value="sogou_weixin">微信</label>
    <label class="check"><input type="checkbox" name="source" value="weibo_mobile">微博</label>
    <span class="spacer"></span>
    <span class="label-main">前台模式</span>
    <label class="switch"><input id="switchFrontend" type="checkbox"><span class="track"></span></label>
  </div>

  <!-- 来源：第 2 行（移动版） -->
  <div class="row tight" style="margin-top: 8px;">
    <button class="btn-text" style="visibility:hidden; pointer-events:none; user-select:none;">全选 / 取消</button>
    <label class="check"><input type="checkbox" name="source" value="baidu_mobile">百度移动版</label>
    <label class="check"><input type="checkbox" name="source" value="zhidao_mobile">知道移动版</label>
    <label class="check"><input type="checkbox" name="source" value="toutiao_mobile">头条移动版</label>
    <label class="check"><input type="checkbox" name="source" value="sogou_mobile">搜狗移动版</label>
    <label class="check"><input type="checkbox" name="source" value="so360_mobile">360移动版</label>
  </div>

  <div class="hdiv"></div>

  <!-- 【3】书签区（内容由 window.renderBookmarks 渲染） -->
  <div id="bookmarkRow" class="chips"></div>
</section>

<!-- ============ 卡B：工具栏 + 结果表格 + 来源页签 ============ -->
<section class="card grow">
  <div class="row tight">
    <button id="btnTbSelectAll" class="btn-sm">全选/取消</button>
    <span class="sep"></span>
    <button id="btnTbOpen" class="btn-sm btn-sm-green">批量打开</button>
    <button id="btnTbCopy" class="btn-sm btn-sm-green">批量复制</button>
    <span class="sep"></span>
    <button id="btnTbWhite" class="btn-sm">加白名单</button>
    <button id="btnTbWhiteWords" class="btn-sm">白名单词</button>
    <button id="btnTbResetWhite" class="btn-sm btn-sm-quiet">重置白名单</button>
    <span class="sep"></span>
    <button id="btnTbExport" class="btn-sm">导出结果</button>
    <button id="btnTbClear" class="btn-sm btn-sm-gray">清空列表</button>
    <button id="btnTbHistory" class="btn-sm">载入历史数据</button>
    <button id="btnTbClearSeen" class="btn-sm btn-sm-quiet">重置历史记录</button>
    <span class="spacer"></span>
    <input id="tableSearchInput" class="input input-search" type="text"
           placeholder="筛选标题/摘要/链接">
    <button id="btnTbSearchClear" class="btn-sm btn-sm-gray">清空</button>
  </div>

  <!-- 【5】结果表格 -->
  <div class="table-scroll">
    <div class="table-inner">
      <div class="table-head">
        <div class="th col-check"><input type="checkbox" id="checkAllRow" title="全选/取消"></div>
        <div class="th col-src">来源</div>
        <div class="th col-title">标题</div>
        <div class="th col-date">日期</div>
        <div class="th col-abs">摘要</div>
        <div class="th col-url">最终 url</div>
      </div>
      <!-- 数据行稍后追加：<div class="table-row">…</div>（每行底部自带浅灰分隔线） -->
      <div id="tableBody"></div>
    </div>
  </div>

  <!-- 【6】来源页签 -->
  <div id="tabs" class="tabs">
    <span class="tab active">全部</span>
    <span class="tab">夸克</span>
    <span class="tab">百度</span>
    <span class="tab">知道</span>
    <span class="tab">贴吧</span>
    <span class="tab">必应</span>
    <span class="tab">头条</span>
    <span class="tab">搜狗</span>
    <span class="tab">360</span>
    <span class="tab">微信</span>
    <span class="tab">微博</span>
    <span class="tab">文心</span>
  </div>
</section>

<!-- ============ 卡C：日志区 ============ -->
<section class="log" id="log">
  <div class="log-body" id="logBody"></div>
</section>

<!-- ============ 验证码遮罩弹窗（前台模式撞验证码时由 Python 唤起） ============ -->
<div id="captchaDialog" class="mask">
  <div class="dialog">
    <div class="dialog-title">需要过验证码</div>
    <div id="captchaText" class="dialog-text"></div>
    <div class="dialog-btns">
      <button id="btnCaptchaStop" class="btn btn-soft">停止本轮</button>
      <button id="btnCaptchaOk" class="btn btn-primary">我已过验证，继续</button>
    </div>
  </div>
</div>

<!-- ============ 白名单词弹窗 ============ -->
<div id="wlWordsDialog" class="mask">
  <div class="dialog">
    <div class="dialog-title">白名单词</div>
    <div class="dialog-text">每行一个词，命中即自动加入白名单</div>
    <textarea id="wlWordsInput" class="dialog-textarea" rows="12" spellcheck="false"></textarea>
    <div class="dialog-btns">
      <button id="btnWlWordsCancel" class="btn btn-soft">取消</button>
      <button id="btnWlWordsSave" class="btn btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- ============ 后缀浮层（批 3-B，内容由 window.openSuffixPopup 渲染） ============ -->
<div id="suffixPopup" style="display:none; position:fixed; background:#fff;
     border:1px solid #E8EBEE; border-radius:8px;
     box-shadow:0 4px 16px rgba(0,0,0,0.12); padding:10px; z-index:9999;
     min-width:240px;"></div>

<script src="js/app.js"></script>

<!-- ============ 框选用的半透明蓝框（批 4-A-2） ============ -->
<div id="dragBox" style="position:fixed; display:none;
     background: rgba(42,157,143,0.15);
     border: 1px solid #2A9D8F;
     pointer-events: none; z-index: 9998;"></div>

<!-- ============ 行右键 / ⋯ 菜单（批 4-A-3，内容由 window.showRowMenu 渲染） ============ -->
<div id="rowContextMenu" style="position:fixed; display:none; background:#fff;
     border:1px solid #E8EBEE; border-radius:6px;
     box-shadow:0 4px 16px rgba(0,0,0,0.12);
     padding:4px 0; z-index: 9999; min-width: 160px;"></div>

</body>

</html>
